[project]
name = "vis-reel"
version = "0.1.0"
description = "Make videos in Python with fframes: scaffold, inspect, render frames and video."
keywords = ["video", "fframes"]
requires-python = ">=3.12"
dependencies = [
  "vis-agent>=0.5.7",
  # Prebuilt fframes wheels from fframes-python, with FFmpeg inside. No Intel Mac wheel.
  "fframes @ https://github.com/Blockether/fframes-python/releases/download/v0.1.0/fframes-0.1.0-cp310-abi3-macosx_15_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "fframes @ https://github.com/Blockether/fframes-python/releases/download/v0.1.0/fframes-0.1.0-cp310-abi3-manylinux_2_35_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "fframes @ https://github.com/Blockether/fframes-python/releases/download/v0.1.0/fframes-0.1.0-cp310-abi3-manylinux_2_35_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "fframes @ https://github.com/Blockether/fframes-python/releases/download/v0.1.0/fframes-0.1.0-cp310-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.vis]
category = "tools"
source_paths = ["src"]
skills = ["skills/fframes"]

[tool.ruff]
line-length = 100
# The README aligns its examples for people to read; ruff must not reflow them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
